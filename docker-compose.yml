name: community

services:
  mysql:
    image: mysql:8.4

    environment:
      MYSQL_DATABASE: community
      MYSQL_USER: community
      MYSQL_PASSWORD: "${MYSQL_PASSWORD:?MYSQL_PASSWORD must be set in .env}"
      MYSQL_ROOT_PASSWORD: "${MYSQL_ROOT_PASSWORD:?MYSQL_ROOT_PASSWORD must be set in .env}"

    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci

    volumes:
      - mysql-data:/var/lib/mysql

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "mysqladmin ping -h 127.0.0.1 -u$${MYSQL_USER} -p$${MYSQL_PASSWORD}"
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

    restart: unless-stopped

  backend:
    build:
      context: .
      dockerfile: Dockerfile

    environment:
      DATABASE_URL: "jdbc:mysql://mysql:3306/community?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Seoul"
      DATABASE_DRIVER: "com.mysql.cj.jdbc.Driver"
      DATABASE_USERNAME: "community"
      DATABASE_PASSWORD: "${MYSQL_PASSWORD:?MYSQL_PASSWORD must be set in .env}"

      SQL_INIT_MODE: "never"
      DDL_AUTO: "update"
      H2_CONSOLE_ENABLED: "false"
      HIBERNATE_FORMAT_SQL: "false"
      HIBERNATE_SQL_LOG_LEVEL: "info"
      HIBERNATE_BIND_LOG_LEVEL: "info"

      JWT_SECRET: "${JWT_SECRET:?JWT_SECRET must be set in .env}"
      COOKIE_SECURE: "${COOKIE_SECURE:-false}"

    depends_on:
      mysql:
        condition: service_healthy

    volumes:
      - "${UPLOAD_DIR:-./runtime/uploads}:/app/uploads"

    expose:
      - "8080"

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "bash -c 'exec 3<>/dev/tcp/127.0.0.1/8080'"
        ]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 30s

    restart: unless-stopped

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  mysql-data: