name: Backend Blue/Green CI/CD

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Grant execute permission
        run: chmod +x gradlew

      - name: Run tests
        run: ./gradlew clean test --no-daemon

      - name: Build application
        run: ./gradlew bootJar --no-daemon

  build-and-push-image:
    needs: build
    runs-on: ubuntu-latest

    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}

      - name: Build backend Docker image
        run: |
          docker build \
            --platform linux/amd64 \
            --tag ${{ secrets.DOCKER_USERNAME }}/community-backend:latest \
            --tag ${{ secrets.DOCKER_USERNAME }}/community-backend:${{ github.sha }} \
            .

      - name: Push backend Docker image
        run: |
          docker push ${{ secrets.DOCKER_USERNAME }}/community-backend:latest
          docker push ${{ secrets.DOCKER_USERNAME }}/community-backend:${{ github.sha }}

  deploy:
    needs: build-and-push-image
    runs-on: ubuntu-latest

    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Prepare SSH key
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

      - name: Test SSH connection
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
        run: |
          ssh \
            -o BatchMode=yes \
            -o ConnectTimeout=15 \
            -o StrictHostKeyChecking=accept-new \
            -i ~/.ssh/deploy_key \
            "$SERVER_USER@$SERVER_HOST" \
            "echo SSH connection successful"

      - name: Deploy backend with Blue/Green
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
        run: |
          ssh \
            -o BatchMode=yes \
            -o ConnectTimeout=15 \
            -o StrictHostKeyChecking=accept-new \
            -i ~/.ssh/deploy_key \
            "$SERVER_USER@$SERVER_HOST" << 'EOF'
              set -e

              cd /home/ubuntu/backend-bluegreen

              if docker ps --format '{{.Names}}' \
                | grep -qx 'community-backend-blue'; then
                TARGET=green
                STOP=community-backend-blue
              elif docker ps --format '{{.Names}}' \
                | grep -qx 'community-backend-green'; then
                TARGET=blue
                STOP=community-backend-green
              else
                TARGET=blue
                STOP=none
              fi

              TARGET_SERVICE="community-backend-$TARGET"

              echo "Deploying backend to $TARGET"

              docker compose pull "$TARGET_SERVICE"
              docker compose up -d "$TARGET_SERVICE"

              HEALTH_CHECK_PASSED=false

              for i in $(seq 1 15); do
                sleep 3

                if docker exec "$TARGET_SERVICE" \
                  curl -fsS http://localhost:8080/health; then
                  HEALTH_CHECK_PASSED=true
                  echo "Backend health check passed"
                  break
                fi

                echo "Health check attempt $i failed"
              done

              if [ "$HEALTH_CHECK_PASSED" != "true" ]; then
                echo "Backend health check failed. Rolling back..."

                docker compose stop "$TARGET_SERVICE"

                if [ "$STOP" != "none" ]; then
                  docker compose up -d "$STOP"
                fi

                exit 1
              fi

              echo "Switching backend Nginx to $TARGET"

              sed -i -E \
                "s/community-backend-(blue|green)/community-backend-$TARGET/g" \
                nginx.conf

              docker compose up -d --force-recreate backend-nginx

              if [ "$STOP" != "none" ]; then
                docker stop "$STOP" || true
              fi

              docker compose ps
          EOF
